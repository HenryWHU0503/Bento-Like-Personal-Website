<!DOCTYPE html>
<html lang="zh-cn" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章阅读 | 小胡同学</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入网页头像 -->
    <link rel="icon" href="asset/小胡透明.png">
    <!-- 引入 Font Awesome -->
    <link href="https://lib.baomitu.com/font-awesome/7.0.0/css/all.min.css" rel="stylesheet">
    <!-- 引入 Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- 引入自定义样式 -->
    <link rel="stylesheet" href="asset/styles.css">
    <style>
        /* 文章块 hover 效果与全站 bento-card 完全一致（上浮 + 阴影），
           .article-item 类仅作为搜索脚本的选取标记，无附加样式 */

        /* 搜索框样式：使用全站 CSS 变量，跟随站内深浅色切换 */
        .search-input {
            transition: all 0.3s ease;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
        }

        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .search-input::placeholder {
            color: var(--muted-color);
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .search-container {
                padding: 0 1rem;
            }

            .articles-list {
                padding: 0 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- 搜索区域 -->
        <div class="mb-8 search-container">
            <a href="javascript:history.back()" class="inline-flex items-center text-primary font-medium text-sm hover:underline"><i class="fa-solid fa-arrow-left ml-1" aria-hidden="true"></i>&nbsp;返回上一页</a>
            <h1 class="text-3xl md:text-4xl font-bold mb-4">文章阅读</h1>
            <p class="text-muted mb-6">探索我的思考、笔记和创作</p>
            
            <div class="relative">
                <input 
                    type="text" 
                    id="search-input" 
                    class="search-input w-full px-5 py-3 rounded-xl focus:outline-none"
                    placeholder="搜索文章标题..."
                >
                <button id="search-btn" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-muted hover:text-primary transition-colors">
                    <i class="fa-solid fa-search"></i>
                </button>
                <button id="clear-btn" class="hidden absolute right-12 top-1/2 -translate-y-1/2 p-2 text-muted hover:text-primary transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <!-- 文章列表 -->
        <div class="space-y-4 articles-list" id="articles-list">
            <!-- 文章 1 -->
            <a href="https://blog.henrywhu.cn/post/1year-anniversary/" class="block bento-card article-item p-6 rounded-2xl hover:shadow-lg transition-all">
                <div class="flex justify-between items-start mb-2">
                    <h2 class="text-xl font-semibold group-hover:text-primary transition-colors">"或许它会继续给世界带来关怀和爱"</h2>
                    <span class="text-xs text-muted px-2 py-1 rounded-full bg-gray-100 dark:bg-gray-700">
                        <i class="fa-regular fa-clock mr-1"></i>3 min read
                    </span>
                </div>
                <p class="text-sm text-muted">2025.09.13 · 博客周年纪念日回顾</p>
            </a>

            <!-- 文章 2 -->
            <a href="https://blog.henrywhu.cn/post/niuniu/" class="block bento-card article-item p-6 rounded-2xl hover:shadow-lg transition-all">
                <div class="flex justify-between items-start mb-2">
                    <h2 class="text-xl font-semibold group-hover:text-primary transition-colors">阅读札记｜生命本来没有名字</h2>
                    <span class="text-xs text-muted px-2 py-1 rounded-full bg-gray-100 dark:bg-gray-700">
                        <i class="fa-regular fa-clock mr-1"></i>5 min read
                    </span>
                </div>
                <p class="text-sm text-muted">2025.07.07 · 读书心得分享</p>
            </a>

            <!-- 文章 3 -->
            <a href="https://blog.henrywhu.cn/post/yi-ge-fu-du-sheng-de-zi-bai/" class="block bento-card article-item p-6 rounded-2xl hover:shadow-lg transition-all">
                <div class="flex justify-between items-start mb-2">
                    <h2 class="text-xl font-semibold group-hover:text-primary transition-colors">一个复读生的自白</h2>
                    <span class="text-xs text-muted px-2 py-1 rounded-full bg-gray-100 dark:bg-gray-700">
                        <i class="fa-regular fa-clock mr-1"></i>15 min read
                    </span>
                </div>
                <p class="text-sm text-muted">2025.06.17 · 个人成长经历</p>
            </a>

            <!-- 更多占位文章 -->
            <div class="block bento-card p-6 rounded-2xl opacity-60">
                <div class="flex justify-between items-start mb-2">
                    <h2 class="text-xl font-semibold text-muted">更多内容陆续更新中...</h2>
                </div>
                <p class="text-sm text-muted">敬请期待</p>
            </div>
        </div>

        <!-- 空状态提示 -->
        <div id="no-results" class="hidden text-center py-12">
            <i class="fa-regular fa-folder-open text-6xl text-muted mb-4"></i>
            <h3 class="text-xl font-semibold mb-2">没有找到相关文章</h3>
            <p class="text-muted">试试其他关键词或者返回首页看看</p>
        </div>

        <!-- 页脚 -->
        <footer class="text-center text-muted py-4">
            <p><a href="https://beian.miit.gov.cn/" target="_blank">渝ICP备2024036203号</a><br>&copy; 2024-2026 Henry Hu. All rights reserved.</p>
        </footer>
    </div>

    <!-- 自定义脚本 -->
    <script src="asset/script.js"></script>
    <script>
    // 文章搜索功能
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const clearBtn = document.getElementById('clear-btn');
        const articlesList = document.getElementById('articles-list');
        const noResults = document.getElementById('no-results');
        let currentArticles = [];

        // 保存原始文章列表
        const allArticles = Array.from(articlesList.querySelectorAll('.article-item'));

        // 搜索函数
        function searchArticles(query) {
            const lowerQuery = query.toLowerCase().trim();
            
            if (!lowerQuery) {
                showAllArticles();
                return;
            }

            let hasResults = false;
            
            allArticles.forEach(article => {
                const title = article.querySelector('h2').textContent.toLowerCase();
                const desc = article.querySelector('p').textContent.toLowerCase();
                
                if (title.includes(lowerQuery) || desc.includes(lowerQuery)) {
                    article.style.display = 'block';
                    hasResults = true;
                } else {
                    article.style.display = 'none';
                }
            });

            // 显示空状态
            noResults.classList.toggle('hidden', hasResults);
        }

        // 显示所有文章
        function showAllArticles() {
            allArticles.forEach(article => {
                article.style.display = 'block';
            });
            noResults.classList.add('hidden');
        }

        // 搜索按钮点击事件
        searchBtn.addEventListener('click', () => {
            searchArticles(searchInput.value);
        });

        // 回车键搜索
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchArticles(searchInput.value);
            }
        });

        // 清空按钮点击事件
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            showAllArticles();
            clearBtn.classList.add('hidden');
            searchInput.focus();
        });

        // 监听输入
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            clearBtn.classList.toggle('hidden', !query);
        });

        // 移动端触摸支持
        searchBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            searchArticles(searchInput.value);
        }, { passive: false });
    });
    </script>
</body>
</html>
